<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>School Calendar</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>School Calendar</h1>
      <div class="nav-controls">
        <button id="prevMonth" aria-label="Previous month">‹</button>
        <span id="monthLabel"></span>
        <button id="nextMonth" aria-label="Next month">›</button>
      </div>
    </header>

    <div id="configWarning"></div>

    <div class="legend">
      <span class="chip"><span class="swatch" style="background:var(--day1)"></span>Day 1</span>
      <span class="chip"><span class="swatch" style="background:var(--day2)"></span>Day 2</span>
      <span class="chip"><span class="swatch" style="background:var(--day3)"></span>Day 3</span>
      <span class="chip"><span class="swatch" style="background:var(--day4)"></span>Day 4</span>
      <span class="chip"><span class="swatch" style="background:var(--day5)"></span>Day 5</span>
      <span class="chip"><span class="swatch" style="background:var(--day6)"></span>Day 6</span>
      <span class="chip"><span class="swatch" style="background:var(--day7)"></span>Day 7</span>
      <span class="chip" style="cursor:pointer" id="todayBtn">📍 Today</span>
    </div>

    <div class="grid">
      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="days" id="daysGrid"></div>
    </div>

    <div class="sync-status" id="syncStatus"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-handle"></div>
      <button class="close-x" id="closeModalBtn">×</button>
      <h2 id="modalTitle"></h2>
      <div id="termBanners"></div>
      <div id="scheduleWrap"></div>

      <div class="notes-section">
        <h3>Notes</h3>
        <div id="notesList"></div>

        <div class="add-note-form">
          <textarea id="noteBody" placeholder="Add a note, e.g. &quot;Alg Quiz&quot;"></textarea>
          <input id="noteAuthor" type="text" placeholder="Your name (optional)" />
          <button id="addNoteBtn">Add note</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="schedule-data.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
